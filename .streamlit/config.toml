[theme]
primaryColor = "#6366f1"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#262730"
textColor = "#fafafa"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
enableCORS = false

[client]
showErrorDetails = false

[runner]
fastReruns = true

[browser]
gatherUsageStats = false
